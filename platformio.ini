; Murmur node firmware — ESP32-C3 SuperMini
;
;   pio run -t upload            # flash over USB
;   pio device monitor           # serial log (115200)
;   pio run -e ota -t upload --upload-port murmur-xxxxxx.local   # flash over Wi-Fi

[platformio]
default_envs = supermini

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots for OTA
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  adafruit/Adafruit AHTX0@^2.0.5
  adafruit/Adafruit BMP280 Library@^2.6.8
  adafruit/Adafruit BME280 Library@^2.2.4
build_flags =
  -D MURMUR_FW_VERSION=\"1.0.0\"
  -D CORE_DEBUG_LEVEL=0

[env:supermini]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
  ${env.build_flags}
  ; native USB serial on the SuperMini
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; onboard blue LED (GPIO8, lit when LOW) and BOOT button (GPIO9)
  -D MURMUR_LED_PIN=8
  -D MURMUR_LED_ACTIVE_LOW=1
  -D MURMUR_BUTTON_PIN=9

; Over-the-air updates after the first USB flash.
; Set the password with --upload-flags or below if you configured one in the portal.
[env:ota]
extends = env:supermini
upload_protocol = espota
; upload_port = murmur-a1b2c3.local
; upload_flags = --auth=your-ota-password
